name: CI Build & Test

on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main
jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Budowanie obrazu Docker
        run: |
          docker build -t devops-app:test -f app/Dockerfile .
